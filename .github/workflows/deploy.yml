name: Deploy to GitHub Pages

on:
  push:
    branches: [master, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The live app always comes from master, whichever branch triggered this
      # run: deploy-pages replaces the whole site, so a push to `preview` has to
      # rebuild production alongside its own build or it would take it down.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Fetch drift web assets
        run: bash tool/fetch_web_assets.sh

      # --no-web-resources-cdn keeps CanvasKit on our own origin. By default
      # Flutter fetches it from gstatic.com, which would make the app need the
      # network to start at all — and the service worker cannot cache a
      # third-party URL it never sees.
      - name: Build master
        run: flutter build web --base-href ${{ env.BASE }}/ --no-web-resources-cdn

      - name: Collect master into the site root
        run: |
          mkdir -p site
          cp -r build/web/. site/

      # The service worker is only recognised as new if its bytes change, so
      # the commit goes into it. Without this every deploy would look identical
      # to the browser and nobody would ever be offered an update.
      #
      # Deliberately master's own commit, not GITHUB_SHA: a push to `preview`
      # rebuilds production too, and stamping that run's SHA would change the
      # live service worker although master did not move — every class would be
      # offered an "update" to a build identical but for this line. HEAD is
      # still master here; the preview branch is checked out further down.
      - name: Stamp the build into the service worker
        run: |
          MASTER_SHA="$(git rev-parse HEAD)"
          sed -i "s/__BUILD_ID__/${MASTER_SHA}/" site/sw.js
          grep -q "${MASTER_SHA}" site/sw.js

      # The `preview` branch is served from /preview/ so a work-in-progress
      # build can be opened on a phone or an iPad over HTTPS — LAN testing is no
      # substitute, because OPFS and service workers need a secure context.
      #
      # Deliberately not gated on analyze/test: a preview is unfinished by
      # definition. continue-on-error keeps a broken preview branch from
      # blocking the production deploy. A missing `preview` branch fails the
      # fetch on the first line and skips the rest, which is the intended path.
      #
      # Note that both URLs share one origin and therefore one browser
      # database — see KONZEPT-zufall-und-gruppen.md.
      - name: Build the preview branch
        continue-on-error: true
        run: |
          git fetch --no-tags origin preview
          git checkout --force FETCH_HEAD
          rm -rf build/web
          flutter pub get
          bash tool/fetch_web_assets.sh
          flutter build web --base-href ${{ env.BASE }}/preview/ --no-web-resources-cdn
          mkdir -p site/preview
          cp -r build/web/. site/preview/
          # Stamped with the preview commit, and skipped while that branch
          # predates the service worker.
          if [ -f site/preview/sw.js ]; then
            sed -i "s/__BUILD_ID__/preview-$(git rev-parse HEAD)/" site/preview/sw.js
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
