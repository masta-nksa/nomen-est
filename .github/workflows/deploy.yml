name: Deploy to GitHub Pages

on:
  push:
    branches: [master, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The live app always comes from master, whichever branch triggered this
      # run: deploy-pages replaces the whole site, so a push to `preview` has to
      # rebuild production alongside its own build or it would take it down.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Version festgenagelt, nicht nur der Kanal. Flutter bestimmt
      # main.dart.js, flutter.js und das ganze canvaskit-Verzeichnis; auf
      # `stable` allein brachte der naechste beliebige Commit den Klassen eine
      # neue Engine, ohne dass jemand ein Update beschlossen haette. Ein
      # Flutter-Wechsel ist damit eine eigene Aenderung, die wie jede andere
      # zuerst ueber preview geht.
      #
      # 3.47.1 ist die Version, mit der die freigegebene App gebaut ist.
      # web/flutter_bootstrap.js ist eine Kopie von Flutters Vorlage und muss
      # beim Hochsetzen gegen das Original geprueft werden.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Fetch drift web assets
        run: bash tool/fetch_web_assets.sh

      # --no-web-resources-cdn keeps CanvasKit on our own origin. By default
      # Flutter fetches it from gstatic.com, which would make the app need the
      # network to start at all — and the service worker cannot cache a
      # third-party URL it never sees.
      - name: Build master
        run: flutter build web --base-href ${{ env.BASE }}/ --no-web-resources-cdn

      - name: Collect master into the site root
        run: |
          mkdir -p site
          cp -r build/web/. site/

      # The service worker is only recognised as new if its bytes change, so a
      # build id goes into it. Without this every deploy would look identical to
      # the browser and nobody would ever be offered an update.
      #
      # The id is a hash of what was actually built, not the commit. The Flutter
      # web build is reproducible — same sources, byte-identical output — so a
      # commit that only touches documentation or this workflow leaves the hash
      # alone and the classes are left in peace. Keyed on the commit, every
      # README fix offered them an update to an identical build.
      #
      # sw.js is excluded because it is what the id is written into; including
      # it would make the hash depend on itself. At this point `site` holds only
      # production, the preview is built further down.
      - name: Stamp the build into the service worker
        run: |
          BUILD_ID="$(cd site && find . -type f ! -name sw.js -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
          echo "Build-ID: ${BUILD_ID}"
          sed -i "s/__BUILD_ID__/${BUILD_ID}/" site/sw.js
          grep -q "${BUILD_ID}" site/sw.js

      # The `preview` branch is served from /preview/ so a work-in-progress
      # build can be opened on a phone or an iPad over HTTPS — LAN testing is no
      # substitute, because OPFS and service workers need a secure context.
      #
      # Deliberately not gated on analyze/test: a preview is unfinished by
      # definition. continue-on-error keeps a broken preview branch from
      # blocking the production deploy. A missing `preview` branch fails the
      # fetch on the first line and skips the rest, which is the intended path.
      #
      # Note that both URLs share one origin and therefore one browser
      # database — see KONZEPT-zufall-und-gruppen.md.
      - name: Build the preview branch
        continue-on-error: true
        run: |
          git fetch --no-tags origin preview
          git checkout --force FETCH_HEAD
          rm -rf build/web
          flutter pub get
          bash tool/fetch_web_assets.sh
          flutter build web --base-href ${{ env.BASE }}/preview/ --no-web-resources-cdn
          mkdir -p site/preview
          cp -r build/web/. site/preview/
          # Same content hash, and skipped while that branch predates the
          # service worker. The `preview-` prefix keeps the two ids apart at a
          # glance when checking which build is served where.
          if [ -f site/preview/sw.js ]; then
            PREVIEW_ID="$(cd site/preview && find . -type f ! -name sw.js -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
            sed -i "s/__BUILD_ID__/preview-${PREVIEW_ID}/" site/preview/sw.js
            grep -q "${PREVIEW_ID}" site/preview/sw.js
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
