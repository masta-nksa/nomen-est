<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Namen der Klasse lernen. Alles bleibt auf dem Gerät.">
  <meta name="theme-color" content="#FF890A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nomen est">
  <!-- Eigenes, deckendes Icon: iOS fuellt Transparenz mit Schwarz,
       Icon-192.png hat runde und damit transparente Ecken. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nomen est</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Service Worker selbst registrieren. Flutter tut es seit 3.44 nicht mehr:
    der Loader meldet nur noch bestehende Registrierungen an, neue Besucher
    bekommen gar keine (siehe flutter#156910). Ohne das hier laeuft die App
    nicht offline und merkt nie, dass eine neue Fassung bereitliegt.
  -->
  <script>
    (function () {
      var api = window.nomenEst = window.nomenEst || {};
      api.updateReady = false;
      api.onUpdateReady = null;

      if (!('serviceWorker' in navigator)) {
        api.applyUpdate = function () { location.reload(); };
        return;
      }

      var waiting = null;
      // Ob die Seite schon von einem Worker kontrolliert wird, entscheidet
      // spaeter ueber das Neuladen. Muss hier abgelesen werden, bevor der
      // erste Worker die Kontrolle uebernimmt.
      var wasControlled = !!navigator.serviceWorker.controller;

      function announce(worker) {
        waiting = worker;
        api.updateReady = true;
        if (typeof api.onUpdateReady === 'function') api.onUpdateReady();
      }

      api.applyUpdate = function () {
        // Ohne wartenden Worker bleibt das Neuladen — besser als ein Knopf,
        // der nichts tut.
        if (waiting) waiting.postMessage({ type: 'SKIP_WAITING' });
        else location.reload();
      };

      // Erst nach dem Laden, damit die Registrierung nicht mit dem Start der
      // App um die Bandbreite konkurriert.
      // Ein Service Worker aus einem frueheren Pfad dieser Domain bedient
      // seine alte Adresse offline weiter, auch wenn der Server dort laengst
      // 404 liefert — nach der Umbenennung von /namen-lern-app/ auf
      // /nomen-est/ etwa. Das ist nicht bloss unaufgeraeumt: die alte Kopie
      // laeuft mit altem Code auf derselben, inzwischen neueren Datenbank.
      // Deshalb raeumt die App beim Start jede Registrierung ausserhalb ihres
      // eigenen Scopes ab.
      function dropForeignWorkers() {
        if (!navigator.serviceWorker.getRegistrations) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            if (reg.scope.indexOf(document.baseURI) !== 0) reg.unregister();
          });
        });
      }

      window.addEventListener('load', function () {
        dropForeignWorkers();
        navigator.serviceWorker.register(new URL('sw.js', document.baseURI)).then(function (reg) {
          // Ein wartender Worker bei bereits kontrollierter Seite heisst:
          // Update liegt bereit. Ohne controller ist es die Erstinstallation,
          // und die ist kein Update.
          if (reg.waiting && navigator.serviceWorker.controller) announce(reg.waiting);

          // Beim Zurueckkehren in den Vordergrund nachfragen. Eine zum
          // Homescreen hinzugefuegte App wird oft wochenlang nur weggelegt und
          // wieder hervorgeholt, nie geschlossen — ohne das hier bliebe sie
          // beliebig lange auf einem alten Stand, ohne es je zu merken.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              reg.update().catch(function () {});
            }
          });

          reg.addEventListener('updatefound', function () {
            var incoming = reg.installing;
            if (!incoming) return;
            incoming.addEventListener('statechange', function () {
              if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
                announce(incoming);
              }
            });
          });
        }).catch(function (error) {
          console.warn('Service Worker nicht registriert:', error);
        });

        // Der Wechsel des Workers ist das Signal zum Neuladen — aber nur bei
        // einem echten Wechsel. Beim ersten Besuch uebernimmt der Worker per
        // clients.claim() ebenfalls die Kontrolle, und darauf neu zu laden
        // hiesse, jeden Erstbesuch mit einem Neustart zu beginnen.
        // Die Sperre verhindert zusaetzlich die Schleife, in die Safari sonst
        // laeuft.
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloading || !wasControlled) return;
          reloading = true;
          location.reload();
        });
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
